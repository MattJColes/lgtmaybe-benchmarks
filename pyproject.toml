[project]
name = "lgtmaybe-bench"
version = "0.1.0"
description = "Repeatable recall, precision, cost, and timing benchmarks for lgtmaybe"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bench = "lgtmaybe_bench.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["corpus"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
